<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="일본 여행을 준비할 때 필요한 지역별 명소, 체험, 축제, 먹거리와 위치를 지도에서 찾아보세요.">
  <meta name="theme-color" content="#182523">
  <title>일본 여행 가이드</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Ccircle cx='18' cy='18' r='18' fill='%23182523'/%3E%3Cpath d='m7 23 7-8 5 6 4-4 6 6M8 26h20M22.5 10.5h.01' fill='none' stroke='%23f3a188' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script src="opening.js" defer></script>
</head>
<body>
  <main>
    <section class="hero" id="opening" aria-labelledby="hero-title">
      <div class="hero-images" aria-hidden="true">
        <div class="scene is-active" data-image="mountain"></div>
        <div class="scene" data-image="city"></div>
        <div class="scene" data-image="coast"></div>
      </div>
      <div class="hero-shade" aria-hidden="true"></div>
      <header class="header layout">
        <a class="wordmark" href="#opening" aria-label="일본 여행 가이드 첫 화면">
          <span class="brand-icon" aria-hidden="true"><svg viewBox="0 0 36 36" fill="none"><circle cx="18" cy="18" r="17.3"/><path d="m7 23 7-8 5 6 4-4 6 6M8 26h20M22.5 10.5h.01"/></svg></span>
          <strong>일본 여행 가이드</strong>
        </a>
      </header>

      <div class="hero-content layout">
        <div class="hero-copy" id="hero-copy" aria-live="polite">
          <p class="eyebrow hero-kicker" id="hero-kicker">가와구치호 · 야마나시</p>
          <h1 id="hero-title">일본 여행지<br>한눈에 보기</h1>
          <p class="hero-description" id="hero-description">지역별 명소, 체험, 축제, 먹거리를 찾아보세요.<br>가고 싶은 곳의 위치는 지도에서 확인할 수 있어요.</p>
        </div>
        <a class="primary-link" href="map.html?region=chubu">여행 지도 보기<svg aria-hidden="true" viewBox="0 0 24 24" fill="none"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3V6Zm6-3v15m6-12v15"/></svg></a>
      </div>

      <div class="hero-bottom layout">
        <div class="scene-picker" role="group" aria-label="여행지 미리보기">
          <button class="scene-button" type="button" data-choice="mountain" aria-pressed="true"><span class="scene-thumb mountain-thumb" aria-hidden="true"></span><span>후지산</span></button>
          <button class="scene-button" type="button" data-choice="city" aria-pressed="false"><span class="scene-thumb city-thumb" aria-hidden="true"></span><span>도쿄</span></button>
          <button class="scene-button" type="button" data-choice="coast" aria-pressed="false"><span class="scene-thumb coast-thumb" aria-hidden="true"></span><span>오키나와</span></button>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
