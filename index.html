<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="북쪽 홋카이도부터 남쪽 오키나와까지, 일본 10개 지역의 명소와 즐길 거리, 지역 음식을 찾아보세요.">
  <title>일본 한 바퀴 | 지역별 일본 여행 가이드</title>
  <link rel="stylesheet" href="styles/style.css">
  <script defer src="scripts/main.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#top"><span class="sun" aria-hidden="true"></span> 일본 한 바퀴</a>
    <nav aria-label="주 메뉴"><a href="#regions">지역 탐색</a></nav>
  </header>
  <main id="top">
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-copy">
        <p class="eyebrow" lang="en">JAPAN TRAVEL GUIDE</p>
        <h1 id="hero-title">일본, 어디부터<br>가볼까요?</h1>
        <p>북쪽 홋카이도의 설원부터 남쪽 오키나와의 바다까지. 명소, 놀거리, 먹거리로 다음 여행지를 찾아보세요.</p>
        <a class="cta" href="#regions">지역 둘러보기</a>
      </div>
      <figure class="hero-photo">
        <img src="image/wei-AeYjrcT5Jhc-unsplash.jpg" alt="아라쿠라야마에서 바라본 후지산과 붉은 오층탑" fetchpriority="high" width="480" height="720">
        <figcaption>후지산 · 야마나시</figcaption>
      </figure>
    </section>
    <section class="explore" id="regions" aria-labelledby="regions-title">
      <p class="eyebrow" lang="en">EXPLORE BY REGION</p>
      <h2 id="regions-title">일본 지역 탐색</h2>
      <div class="filters">
        <label>지역 <select id="region"><option value="">모든 지역</option></select></label>
        <label>검색 <input id="search" type="search" placeholder="예: 온천, 도쿄, 우동"></label>
      </div>
      <div class="categories" id="categories" role="group" aria-label="여행 테마">
        <button type="button" data-category="" aria-pressed="true">전체 테마</button>
        <button type="button" data-category="sight" aria-pressed="false">관광명소</button>
        <button type="button" data-category="activity" aria-pressed="false">놀거리</button>
        <button type="button" data-category="food" aria-pressed="false">먹거리</button>
      </div>
      <p id="result-count" role="status"></p>
      <div class="region-grid" id="results"></div>
      <noscript><p>지역 탐색을 이용하려면 브라우저에서 JavaScript를 켜주세요.</p></noscript>
    </section>
  </main>
  <footer>
    <span class="brand"><span class="sun" aria-hidden="true"></span> 일본 한 바퀴</span>
    <a href="https://www.japan.travel/ko/kr/">일본정부관광국 공식 가이드</a>
  </footer>
</body>
</html>
